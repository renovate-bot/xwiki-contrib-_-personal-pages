# Builds pull requests: runs XWiki's XAR checks and attaches the installable .xar to the run. Branches are built
# (and snapshots deployed) by ci.xwiki.org from the Jenkinsfile.
name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify the XAR
        run: mvn --batch-mode --no-transfer-progress --settings settings.xml clean install
      - uses: actions/upload-artifact@v7
        with:
          name: application-personal-pages-xar
          path: target/*.xar
          if-no-files-found: error
